<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">Kkiu monochrome mark concepts</title>
  <desc id="desc">Three monochrome logo concepts shown large and at small icon size.</desc>
  <rect width="1500" height="760" fill="#f5f5f3"/>
  <text x="70" y="72" fill="#111216" font-family="Arial, sans-serif" font-size="28" font-weight="700">KKIU — SHAPE FIRST</text>
  <text x="70" y="108" fill="#6d7077" font-family="Arial, sans-serif" font-size="18">No color, no glass, no decoration. Test the idea at 32 px.</text>

  <g transform="translate(70 150)">
    <rect width="400" height="500" rx="36" fill="#fff"/>
    <rect x="56" y="44" width="288" height="288" rx="63" fill="#111216"/>
    <rect x="119" y="102" width="162" height="45" rx="16" fill="#fff"/>
    <rect x="119" y="228" width="162" height="45" rx="16" fill="#fff"/>
    <path d="M92 165h146c12.4 0 22.5 10.1 22.5 22.5S250.4 210 238 210H92l22.5-22.5L92 165Z" fill="#fff"/>
    <rect x="271" y="169.5" width="10" height="36" rx="5" fill="#fff"/>
    <text x="56" y="382" fill="#111216" font-family="Arial, sans-serif" font-size="24" font-weight="700">01  BETWEEN</text>
    <text x="56" y="416" fill="#6d7077" font-family="Arial, sans-serif" font-size="17">A task enters an exact gap.</text>
    <rect x="56" y="446" width="32" height="32" rx="7" fill="#111216"/>
    <rect x="63" y="452.5" width="18" height="5" rx="2" fill="#fff"/>
    <rect x="63" y="466.5" width="18" height="5" rx="2" fill="#fff"/>
    <path d="M60 460.5h16c1.4 0 2.5 1.1 2.5 2.5s-1.1 2.5-2.5 2.5H60l2.5-2.5-2.5-2.5Z" fill="#fff"/>
    <rect x="80" y="461" width="1.2" height="4" rx=".6" fill="#fff"/>
    <text x="102" y="470" fill="#6d7077" font-family="Arial, sans-serif" font-size="15">32 px</text>
  </g>

  <g transform="translate(550 150)">
    <rect width="400" height="500" rx="36" fill="#fff"/>
    <rect x="56" y="44" width="288" height="288" rx="63" fill="#111216"/>
    <circle cx="119" cy="125" r="19" fill="#fff"/>
    <rect x="152" y="106" width="129" height="38" rx="15" fill="#fff"/>
    <circle cx="119" cy="251" r="19" fill="#fff"/>
    <rect x="152" y="232" width="129" height="38" rx="15" fill="#fff"/>
    <path d="M105 169h141l30 19-30 19H105c-10.5 0-19-8.5-19-19s8.5-19 19-19Z" fill="#fff"/>
    <text x="56" y="382" fill="#111216" font-family="Arial, sans-serif" font-size="24" font-weight="700">02  REORDER</text>
    <text x="56" y="416" fill="#6d7077" font-family="Arial, sans-serif" font-size="17">The middle item changes rank.</text>
    <rect x="56" y="446" width="32" height="32" rx="7" fill="#111216"/>
    <circle cx="63" cy="455" r="2.1" fill="#fff"/>
    <rect x="67" y="453" width="14" height="4" rx="1.5" fill="#fff"/>
    <circle cx="63" cy="469" r="2.1" fill="#fff"/>
    <rect x="67" y="467" width="14" height="4" rx="1.5" fill="#fff"/>
    <path d="M60 459.5h15.5l3.5 3-3.5 3H60a3 3 0 0 1 0-6Z" fill="#fff"/>
    <text x="102" y="470" fill="#6d7077" font-family="Arial, sans-serif" font-size="15">32 px</text>
  </g>

  <g transform="translate(1030 150)">
    <rect width="400" height="500" rx="36" fill="#fff"/>
    <rect x="56" y="44" width="288" height="288" rx="63" fill="#111216"/>
    <path d="M105 96h190v65H184l-33 27h-46V96Z" fill="#fff"/>
    <path d="M105 280h190v-65H184l-33-27h-46v92Z" fill="#fff"/>
    <rect x="176" y="166" width="142" height="44" rx="18" fill="#fff"/>
    <text x="56" y="382" fill="#111216" font-family="Arial, sans-serif" font-size="24" font-weight="700">03  SLOT</text>
    <text x="56" y="416" fill="#6d7077" font-family="Arial, sans-serif" font-size="17">The list opens; the task locks in.</text>
    <rect x="56" y="446" width="32" height="32" rx="7" fill="#111216"/>
    <path d="M61 452h22v7.5H70l-4 3h-5V452Z" fill="#fff"/>
    <path d="M61 472h22v-7.5H70l-4-3h-5V472Z" fill="#fff"/>
    <rect x="69" y="460" width="16" height="5" rx="2" fill="#fff"/>
    <text x="102" y="470" fill="#6d7077" font-family="Arial, sans-serif" font-size="15">32 px</text>
  </g>

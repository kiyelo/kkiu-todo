name: One-shot tab performance optimization

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-tab-performance.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply focused performance changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          app_path = Path('app/src/App.jsx')
          app = app_path.read_text()
          app = replace_one(
              app,
              'if (hasSupabaseConfig && session === undefined) return <div className="app-shell"><section className="phone loading-screen">끼우를 준비하고 있어요…</section></div>',
              'if (hasSupabaseConfig && session === undefined) return <div className="app-shell" aria-hidden="true" />',
              'silent auth bootstrap',
          )
          app = replace_one(
              app,
              "{remoteLoading && !testMode ? <main className=\"screen-scroll loading-screen\">{language === 'en' ? 'Loading to-dos…' : '할 일을 불러오고 있어요…'}</main> : tab === 'more' ?",
              "{tab === 'more' ?",
              'remove blocking remote loading screen',
          )
          app = replace_one(
              app,
              '<QueueScreen key={`${tab}-${circle?.id || \'none\'}-${focusTaskId || \'\'}-${focusVisit}`} tasks={tasks}',
              '<QueueScreen viewKey={`${tab}:${circle?.id || \'none\'}`} focusVisit={focusVisit} dataReady={!remoteLoading} tasks={tasks}',
              'preserve queue screen across tabs',
          )
          app_path.write_text(app)

          queue_path = Path('app/src/components/QueueScreen.jsx')
          queue = queue_path.read_text()
          queue = replace_one(
              queue,
              "const { tasks, members, circle, circleMode, onCreateCircle, onJoinCircle, query, onQuery, onSearchResult, focusTaskId, newTaskId, filter, onFilter, onAdd, onComplete, onEdit, onAssignee, onMove, onMoveTo, selecting, selected, onSelect, onLongPress, onSelectAll, onDeleteSelected, onAssignSelected, onCancelSelect, onCompleted, initialPosition = null, onPositionChange, language = 'ko' } = props",
              "const { viewKey, focusVisit = 0, dataReady = true, tasks, members, circle, circleMode, onCreateCircle, onJoinCircle, query, onQuery, onSearchResult, focusTaskId, newTaskId, filter, onFilter, onAdd, onComplete, onEdit, onAssignee, onMove, onMoveTo, selecting, selected, onSelect, onLongPress, onSelectAll, onDeleteSelected, onAssignSelected, onCancelSelect, onCompleted, initialPosition = null, onPositionChange, language = 'ko' } = props",
              'queue screen navigation props',
          )
          queue = replace_one(
              queue,
              '}, [filter, expanded, focusTaskId])',
              '}, [viewKey, dataReady, filter, expanded, focusTaskId, focusVisit])',
              'queue reposition dependencies',
          )
          queue_path.write_text(queue)

          more_path = Path('app/src/components/MoreScreen.jsx')
          more = more_path.read_text()
          more = replace_one(more, '  const entryAligned = useRef(false)\n', '', 'remove entry alignment ref')
          more = replace_one(more, '  const [entrySettled, setEntrySettled] = useState(false)\n', '', 'remove entry settled state')
          more = replace_one(
              more,
              "  useLayoutEffect(() => {\n    const next = [...(trackRef.current?.querySelectorAll('.more-qitem') || [])].map((element) => Math.ceil(element.getBoundingClientRect().height))",
              "  useEffect(() => {\n    const next = [...(trackRef.current?.querySelectorAll('.more-qitem') || [])].map((element) => Math.ceil(element.getBoundingClientRect().height))",
              'defer more-screen measurement until after first paint',
          )
          more = replace_one(
              more,
              "  const slotPositions = [...positions, cursor]\n  const queue = useFloatingQueue(items.length, 0, {",
              "  const slotPositions = [...positions, cursor]\n  const desiredEntryOffset = Math.max(0, (typeof window === 'undefined' ? 0 : window.innerHeight) / 2 - 10)\n  let initialQueueIndex = 0\n  let initialQueueDistance = Infinity\n  slotPositions.forEach((position, index) => {\n    const distance = Math.abs(position - desiredEntryOffset)\n    if (distance < initialQueueDistance) { initialQueueDistance = distance; initialQueueIndex = index }\n  })\n  const queue = useFloatingQueue(items.length, initialQueueIndex, {",
              'derive more-screen initial position without layout gate',
          )
          more = replace_one(
              more,
              "\n  useLayoutEffect(() => {\n    if (entryAligned.current || heights.length !== items.length || !stageRef.current) return undefined\n    entryAligned.current = true\n    const desired = Math.max(0, stageRef.current.clientHeight / 2 - 10)\n    let nearest = 0\n    let best = Infinity\n    slotPositions.forEach((position, index) => { const distance = Math.abs(position - desired); if (distance < best) { best = distance; nearest = index } })\n    queue.setIndex(nearest)\n    const frame = requestAnimationFrame(() => setEntrySettled(true))\n    return () => cancelAnimationFrame(frame)\n  }, [heights.length, items.length])\n",
              '\n',
              'remove post-mount more-screen alignment pass',
          )
          more = replace_one(
              more,
              "  useEffect(() => {\n    if (!entrySettled) { lastQueueIndex.current = queue.index; return }\n    if (lastQueueIndex.current === null) { lastQueueIndex.current = queue.index; return }\n    if (lastQueueIndex.current !== queue.index) { lastQueueIndex.current = queue.index; if (!locked) spin() }\n  }, [queue.index, locked, entrySettled])",
              "  useEffect(() => {\n    if (lastQueueIndex.current === null) { lastQueueIndex.current = queue.index; return }\n    if (lastQueueIndex.current !== queue.index) { lastQueueIndex.current = queue.index; if (!locked) spin() }\n  }, [queue.index, locked])",
              'skip only the first more-screen slot spin',
          )
          more = replace_one(
              more,
              "className={`stage q more-qstage${entrySettled ? ' entry-settled' : ' entry-aligning'}${queue.dragging ? ' dragging' : ''}${queue.edge ? ` edge-${queue.edge}` : ''}`}",
              "className={`stage q more-qstage entry-settled${queue.dragging ? ' dragging' : ''}${queue.edge ? ` edge-${queue.edge}` : ''}`}",
              'remove more-screen entry gating class',
          )
          more = replace_one(
              more,
              "style={{ top: '50%', transition: entrySettled ? undefined : 'none', transform: `translate3d(0,calc(-${offset}px + ${queue.dragY}px),0)` }}",
              "style={{ top: '50%', transform: `translate3d(0,calc(-${offset}px + ${queue.dragY}px),0)` }}",
              'remove more-screen entry transition gate',
          )
          more_path.write_text(more)

          workflow = Path('.github/workflows/one-shot-tab-performance.yml')
          workflow.unlink()
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify production build
        run: pnpm run build

      - name: Commit optimized runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/App.jsx app/src/components/QueueScreen.jsx app/src/components/MoreScreen.jsx .github/workflows/one-shot-tab-performance.yml
          git diff --cached --check
          git commit -m "Remove blocking tab loading"
          git push origin HEAD:main

name: Apply native queue scroll and login home

on:
  push:
    branches: [agent/launch-home-tab]
    paths:
      - .github/workflows/apply-native-scroll-login-home.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/launch-home-tab
      - name: Apply fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, re

          app = Path('app/src/App.jsx')
          text = app.read_text()
          old = "      if (event === 'TOKEN_REFRESHED') setRemoteReloadKey((current) => current + 1)"
          new = "      if (event === 'SIGNED_IN') setTab('home')\n      if (event === 'TOKEN_REFRESHED') setRemoteReloadKey((current) => current + 1)"
          if old not in text:
              raise SystemExit('auth state target not found')
          text = text.replace(old, new, 1)
          app.write_text(text)

          hook = Path('app/src/hooks/useFloatingQueue.js')
          hook.write_text(r'''import { useCallback, useEffect, useLayoutEffect, useRef, useState } from 'react'
          import { interactionFeedback } from '../services/interactionFeedback.js'

          const clamp = (value, min, max) => Math.max(min, Math.min(max, value))
          const nearest = (positions, value) => {
            let best = 0
            for (let i = 1; i < positions.length; i += 1) {
              if (Math.abs(positions[i] - value) < Math.abs(positions[best] - value)) best = i
            }
            return best
          }

          export default function useFloatingQueue(count, initialIndex = count, options = {}) {
            const rowHeight = options.rowHeight || 80
            const positions = options.positions?.length === count + 1
              ? options.positions
              : Array.from({ length: count + 1 }, (_, i) => i * rowHeight)
            const positionsRef = useRef(positions)
            positionsRef.current = positions

            const [index, setIndexState] = useState(() => clamp(initialIndex, 0, count))
            const [dragging, setDragging] = useState(false)
            const indexRef = useRef(index)
            const scrollerRef = useRef(null)
            const trackRef = useRef(null)
            const scrollEndTimerRef = useRef(null)
            const initializedRef = useRef(false)
            const programmaticRef = useRef(false)
            const ariaLabel = options.ariaLabel || 'Queue position'
            const ariaValueText = options.ariaValueText?.(index + 1, count + 1) || `${index + 1} of ${count + 1}`

            const setVisualPosition = useCallback((position) => {
              if (trackRef.current) trackRef.current.style.transform = `translate3d(0,${-position}px,0)`
            }, [])

            const notifyCrossedSlots = useCallback((from, to) => {
              const distance = Math.abs(to - from)
              for (let i = 0; i < distance; i += 1) interactionFeedback(8)
            }, [])

            const updateIndexFromScroll = useCallback((position) => {
              const next = nearest(positionsRef.current, position)
              if (next === indexRef.current) return
              const previous = indexRef.current
              indexRef.current = next
              setIndexState(next)
              if (!programmaticRef.current) notifyCrossedSlots(previous, next)
            }, [notifyCrossedSlots])

            const setIndex = useCallback((next) => {
              const value = clamp(typeof next === 'function' ? next(indexRef.current) : next, 0, count)
              const previous = indexRef.current
              indexRef.current = value
              if (value !== previous) setIndexState(value)
              const position = positionsRef.current[value] || 0
              programmaticRef.current = true
              if (scrollerRef.current) scrollerRef.current.scrollTop = position
              setVisualPosition(position)
              requestAnimationFrame(() => { programmaticRef.current = false })
            }, [count, setVisualPosition])

            useEffect(() => { indexRef.current = index }, [index])
            useEffect(() => () => window.clearTimeout(scrollEndTimerRef.current), [])

            useLayoutEffect(() => {
              const value = clamp(indexRef.current, 0, count)
              const position = positionsRef.current[value] || 0
              if (scrollerRef.current) {
                programmaticRef.current = true
                scrollerRef.current.scrollTop = position
              }
              setVisualPosition(position)
              initializedRef.current = true
              requestAnimationFrame(() => { programmaticRef.current = false })
            }, [count, positions, setVisualPosition])

            const onScroll = useCallback((event) => {
              if (!initializedRef.current) return
              const position = event.currentTarget.scrollTop
              setVisualPosition(position)
              updateIndexFromScroll(position)
              setDragging(true)
              window.clearTimeout(scrollEndTimerRef.current)
              scrollEndTimerRef.current = window.setTimeout(() => setDragging(false), 90)
            }, [setVisualPosition, updateIndexFromScroll])

            const onKeyDown = useCallback((event) => {
              if (event.key === 'ArrowUp') { event.preventDefault(); setIndex(indexRef.current - 1) }
              if (event.key === 'ArrowDown') { event.preventDefault(); setIndex(indexRef.current + 1) }
              if (event.key === 'Home') { event.preventDefault(); setIndex(0) }
              if (event.key === 'End') { event.preventDefault(); setIndex(count) }
            }, [count, setIndex])

            return {
              index,
              dragY: 0,
              dragging,
              edge: null,
              edgeAmount: 0,
              setIndex,
              rowHeight,
              scrollerRef,
              trackRef,
              scrollProps: { onScroll },
              gestureProps: {
                onKeyDown,
                tabIndex: 0,
                role: 'slider',
                'aria-label': ariaLabel,
                'aria-orientation': 'vertical',
                'aria-valuemin': 1,
                'aria-valuemax': count + 1,
                'aria-valuenow': index + 1,
                'aria-valuetext': ariaValueText,
              },
            }
          }
          '''.replace('          ', ''))

          screen = Path('app/src/components/QueueScreen.jsx')
          text = screen.read_text()
          old = '''<div className="qvp"><div className="qtrack" style={{ top: 'calc(50% + var(--queue-center-shift))', transform: `translate3d(0,calc(-${currentSlot.y}px + ${queue.dragY}px),0)` }}>'''
          new = '''<div className="qvp" ref={queue.scrollerRef} {...queue.scrollProps}><div className="qtrack" ref={queue.trackRef} style={{ top: 'calc(50% + var(--queue-center-shift))', transform: `translate3d(0,${-currentSlot.y}px,0)` }}>'''
          if old not in text:
              raise SystemExit('queue viewport start not found')
          text = text.replace(old, new, 1)
          old_end = '''})}</div></div>{!active.length'''
          new_end = '''})}</div><div className="queue-scroll-space" style={{ height: `calc(100% + ${fullModel.total}px)` }} aria-hidden="true" /></div>{!active.length'''
          if old_end not in text:
              raise SystemExit('queue viewport end not found')
          text = text.replace(old_end, new_end, 1)
          screen.write_text(text)

          css_path = Path('app/src/styles.css')
          css = css_path.read_text()
          old_css = '''  .stage.q{touch-action:none}\n  .stage.q.adding .ico.grip{opacity:.28;pointer-events:none;transition:opacity .18s}\n  .qvp{position:absolute;inset:0;overflow:hidden}\n  .qtrack{position:absolute;left:0;right:0;top:0;padding:0 18px;will-change:transform}'''
          new_css = '''  .stage.q{touch-action:pan-y}\n  .stage.q.adding .ico.grip{opacity:.28;pointer-events:none;transition:opacity .18s}\n  .qvp{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-y}\n  .qvp::-webkit-scrollbar{display:none}\n  .qtrack{position:sticky;left:0;right:0;height:0;padding:0 18px;will-change:transform;z-index:2}\n  .queue-scroll-space{width:1px;pointer-events:none}'''
          if old_css not in css:
              raise SystemExit('queue css target not found')
          css = css.replace(old_css, new_css, 1)
          css_path.write_text(css)

          hybrid = Path('scripts/hybrid-apk-test.mjs')
          ht = hybrid.read_text()
          for path in ['app/src/components/QueueScreen.jsx', 'app/src/hooks/useFloatingQueue.js', 'app/src/styles.css']:
              digest = hashlib.sha256(Path(path).read_text().replace('\r\n', '\n').encode()).hexdigest()
              pattern = re.compile(rf"('{re.escape(path)}':\s*)'[0-9a-f]{{64}}'")
              ht, n = pattern.subn(rf"\1'{digest}'", ht, count=1)
              if n != 1:
                  raise SystemExit(f'hash target not found: {path}')
          hybrid.write_text(ht)

          Path('.github/workflows/apply-native-scroll-login-home.yml').unlink()
          try:
              Path('README.tmp').unlink()
          except FileNotFoundError:
              pass
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use native queue scrolling and open home after sign-in"
          git push origin agent/launch-home-tab

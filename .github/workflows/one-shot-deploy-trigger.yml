name: One-shot deploy trigger cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-deploy-trigger.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove one-shot trigger
        run: |
          rm .github/workflows/one-shot-deploy-trigger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/one-shot-deploy-trigger.yml
          git commit -m "Remove deploy trigger"
          git push origin HEAD:main

name: Apply undo countdown progress

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-undo-countdown-progress.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add countdown progress bar
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('app/src/App.jsx')
          text = app_path.read_text()

          old_pending = """  const pending = {
    batches: [...(previous?.batches || []), batch],
    count: (previous?.count || 0) + items.length,
    remoteIds: [...(previous?.remoteIds || []), ...(remoteUser ? items.map((item) => item.task.id) : [])],
  }"""
          new_pending = """  const pending = {
    batches: [...(previous?.batches || []), batch],
    count: (previous?.count || 0) + items.length,
    remoteIds: [...(previous?.remoteIds || []), ...(remoteUser ? items.map((item) => item.task.id) : [])],
    countdownKey: Date.now(),
  }"""
          if old_pending not in text:
            raise SystemExit('pending delete block not found')
          text = text.replace(old_pending, new_pending, 1)

          old_toast = """{pendingDelete ? <div className=\"app-toast undo-toast\" role=\"status\"><span>{language === 'en' ? `${pendingDelete.count} deleted ·` : `${pendingDelete.count}개 삭제됨 ·`}</span><button type=\"button\" onClick={undoTaskDelete}>{language === 'en' ? 'Undo' : '되돌리기'}</button></div> : toast && <div className=\"app-toast\" role=\"status\">{toast}</div>}"""
          new_toast = """{pendingDelete ? <div className=\"app-toast undo-toast\" role=\"status\"><div className=\"undo-toast-row\"><span>{language === 'en' ? `${pendingDelete.count} deleted ·` : `${pendingDelete.count}개 삭제됨 ·`}</span><button type=\"button\" onClick={undoTaskDelete}>{language === 'en' ? 'Undo' : '되돌리기'}</button></div><div className=\"undo-countdown\" aria-hidden=\"true\"><i key={pendingDelete.countdownKey} /></div></div> : toast && <div className=\"app-toast\" role=\"status\">{toast}</div>}"""
          if old_toast not in text:
            raise SystemExit('undo toast markup not found')
          text = text.replace(old_toast, new_toast, 1)
          app_path.write_text(text)

          css_path = Path('app/src/styles.css')
          css = css_path.read_text()
          marker = '/* undo countdown progress */'
          if marker not in css:
            css += """

/* undo countdown progress */
.undo-toast{overflow:hidden;padding:0!important;display:block!important}
.undo-toast-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 15px 10px}
.undo-countdown{height:3px;width:100%;overflow:hidden;background:rgba(255,255,255,.22)}
.undo-countdown i{display:block;width:100%;height:100%;transform-origin:left center;background:var(--accent,#e0894a);animation:undo-countdown-shrink 5s linear forwards}
@keyframes undo-countdown-shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
"""
          css_path.write_text(css)

          Path('.github/workflows/apply-undo-countdown-progress.yml').unlink()
          PY
      - name: Commit countdown progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/App.jsx app/src/styles.css .github/workflows/apply-undo-countdown-progress.yml
          git commit -m "feat: add undo countdown progress bar"
          git push origin main

<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>끼우 디자인 비교</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#ece7df;color:#1d1d1f}
    body{padding:20px}
    header{max-width:1100px;margin:0 auto 16px}
    h1{margin:0 0 6px;font-size:24px;letter-spacing:-.03em}
    p{margin:0;color:#6e6e73;font-size:14px}
    .grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
    .panel{min-width:0}
    .label{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px;padding:0 4px;font-size:14px;font-weight:700}
    .label small{font-weight:500;color:#86868b}
    iframe{display:block;width:100%;height:min(884px,calc(100vh - 110px));min-height:680px;border:1px solid rgba(60,60,67,.18);border-radius:28px;background:#fbf8f2;box-shadow:0 18px 45px rgba(60,45,25,.14)}
    @media(max-width:820px){body{padding:12px}.grid{grid-template-columns:1fr}.panel{margin-bottom:18px}iframe{height:820px;min-height:720px}}
  </style>
</head>
<body>
  <header>
    <h1>끼우 디자인 비교</h1>
    <p>같은 앱과 같은 계정 데이터를 사용합니다. 왼쪽은 오늘 HIG 수정 전 스타일, 오른쪽은 현재 HIG + 글래스모피즘 스타일입니다.</p>
  </header>
  <main class="grid">
    <section class="panel">
      <div class="label"><span>1. 기존 디자인</span><small>HIG 수정 전</small></div>
      <iframe src="./?design=original" title="기존 디자인"></iframe>
    </section>
    <section class="panel">
      <div class="label"><span>3. 현재 디자인</span><small>HIG + 글래스모피즘</small></div>
      <iframe src="./?design=current" title="현재 디자인"></iframe>
    </section>
  </main>
</body>
</html>

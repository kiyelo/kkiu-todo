apply plugin: 'com.android.test'
apply plugin: 'androidx.baselineprofile'

android {
    namespace = "app.kkiu.todo.baselineprofile"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion 28
        targetSdkVersion rootProject.ext.targetSdkVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    targetProjectPath ':app'

    testOptions.managedDevices.devices {
        pixel6Api35(com.android.build.api.dsl.ManagedVirtualDevice) {
            device 'Pixel 6'
            apiLevel 35
            systemImageSource 'aosp'
        }
    }
}

baselineProfile {
    managedDevices ['pixel6Api35']
    useConnectedDevices false
}

dependencies {
    implementation "androidx.test.ext:junit:$androidxJunitVersion"
    implementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation "androidx.benchmark:benchmark-macro-junit4:1.4.1"
}
